# Upstream watch: once a day, compare the master branch of rustdesk/rustdesk-server with the commit
# recorded in the file UPSTREAM. When master has moved, merge it on a throwaway branch (trial only),
# run ci/test.sh when the merge is clean, and open ONE issue per upstream master commit with the
# new commits (security-looking ones marked), new tags, the hbb_common pin change and the merge and
# test result. Older open upstream issues are closed with a pointer to the new one. Upstream master
# is tracked, not only its tags, because upstream fixes can sit on master for months.
# Every run also looks at three more upstream sources and opens one issue per finding (reporting
# only, nothing is built or merged): new commits of hbb_common's main branch past our submodule pin
# (protocol-touching and security-looking ones marked), new stable RustDesk client releases, and
# merged / closed state of the upstream rustdesk-server pull requests listed in ci/watched-prs.
# Once a week (Mondays, UTC, and on manual runs) it also checks that the hbb_common commit pinned
# here and the commit in UPSTREAM can still be fetched from upstream, and opens an issue when not:
# the AGPL requires the corresponding source to stay available, so a maintainer must publish a backup.
#
# No pull request is opened and nothing is pushed, by design: integration is done in the
# development repository and synced to master through a reviewed pull request (one-way flow).
#
# Trust boundary: upstream code is merged and run (ci/test.sh) only in the job "trial", with a
# read-only token and no secrets, and nothing is pushed from there. The job "report" holds the only
# write permission (issues); it starts from a clean checkout, never builds or runs upstream code,
# and treats what "trial" produced (commit messages, file names, the log) as untrusted data: values
# are validated or cut to a length limit and everything free-form goes into code blocks.
#
# A manual run on a branch other than the default one reports as usual but closes no older issue
# (the issues belong to the default branch's UPSTREAM and pin); dispatch it on the default branch.
#
# GitHub limitations:
# - GitHub disables scheduled workflows after 60 days without repository activity (a commit, not
#   only runs), and they do not run in a fork until Actions is enabled there. Re-enable the
#   workflow in the Actions tab; a manual run (workflow_dispatch) always works.
# - Logic is in ci/upstream-check.sh; DRY_RUN=1 ci/upstream-check.sh report prints instead of
#   calling the issues API.
name: Upstream watch

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Report the current upstream master commit again even if an issue for it exists.
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: upstream-watch-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check upstream master
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read   # look for an existing issue for the commit
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      run_trial: ${{ steps.check.outputs.run_trial }}
      weekly: ${{ steps.check.outputs.weekly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare upstream master with UPSTREAM
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
        run: ci/upstream-check.sh check

  # Runs upstream code: read-only token, no secrets, nothing pushed.
  trial:
    name: Trial merge and tests
    needs: check
    if: needs.check.outputs.run_trial == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream master and run ci/test.sh
        env:
          TARGET_SHA: ${{ needs.check.outputs.sha }}
          OUT: ${{ runner.temp }}/upstream-trial
        run: ci/upstream-check.sh trial

      - name: Keep the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-watch-trial
          path: ${{ runner.temp }}/upstream-trial
          retention-days: 7
          if-no-files-found: ignore

  # Reads git data and the GitHub API of public upstream repositories; builds and runs nothing.
  watch:
    name: hbb_common, client releases, watched pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect what moved upstream
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/upstream-extra
        run: ci/upstream-check.sh watch

      - name: Keep the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-watch-extra
          path: ${{ runner.temp }}/upstream-extra
          retention-days: 7
          if-no-files-found: ignore

  availability:
    name: Pinned sources still available
    needs: check
    if: needs.check.outputs.weekly == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned commits from upstream
        env:
          OUT: ${{ runner.temp }}/upstream-availability
        run: ci/upstream-check.sh availability

      - name: Keep the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-watch-availability
          path: ${{ runner.temp }}/upstream-availability
          retention-days: 7
          if-no-files-found: ignore

  # The only job with a write permission. Never builds or runs upstream code.
  report:
    name: Open and close issues
    needs: [check, trial, availability, watch]
    # Deliberately also runs when check failed: the watch sources are still reported. UPSTREAM_SHA is
    # then empty and closing superseded server issues is skipped.
    if: ${{ !cancelled() && (needs.trial.result == 'success' || needs.availability.result == 'success' || needs.watch.result == 'success' || needs.watch.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read   # check out this repository's own script
      issues: write
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloaded by name, not `pattern:`: with exactly one match download-artifact unpacks straight
      # into `path` instead of `path/<name>/`, and report found no meta.env. A job that failed early
      # may have uploaded nothing (report copes). A failed download (a digest mismatch included) may
      # leave partial files, so its directory is removed before the one retry (after a short pause), and
      # again by the cleanup step below if the retry fails too: report sees no data, never unverified data.
      - name: Get the trial result
        id: dl_trial
        if: ${{ !cancelled() && (needs.trial.result == 'success' || needs.trial.result == 'failure') }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-watch-trial
          path: ${{ runner.temp }}/in/upstream-watch-trial

      - name: Clean up before retrying the trial download
        if: ${{ steps.dl_trial.outcome == 'failure' }}
        run: |
          rm -rf "${RUNNER_TEMP}/in/upstream-watch-trial"
          sleep 15

      - name: Get the trial result (retry)
        id: dl_trial_retry
        if: ${{ steps.dl_trial.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-watch-trial
          path: ${{ runner.temp }}/in/upstream-watch-trial

      - name: Get the availability result
        id: dl_availability
        if: ${{ !cancelled() && (needs.availability.result == 'success' || needs.availability.result == 'failure') }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-watch-availability
          path: ${{ runner.temp }}/in/upstream-watch-availability

      - name: Clean up before retrying the availability download
        if: ${{ steps.dl_availability.outcome == 'failure' }}
        run: |
          rm -rf "${RUNNER_TEMP}/in/upstream-watch-availability"
          sleep 15

      - name: Get the availability result (retry)
        id: dl_availability_retry
        if: ${{ steps.dl_availability.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-watch-availability
          path: ${{ runner.temp }}/in/upstream-watch-availability

      - name: Get the watch result
        id: dl_watch
        if: ${{ !cancelled() && (needs.watch.result == 'success' || needs.watch.result == 'failure') }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-watch-extra
          path: ${{ runner.temp }}/in/upstream-watch-extra

      - name: Clean up before retrying the watch download
        if: ${{ steps.dl_watch.outcome == 'failure' }}
        run: |
          rm -rf "${RUNNER_TEMP}/in/upstream-watch-extra"
          sleep 15

      - name: Get the watch result (retry)
        id: dl_watch_retry
        if: ${{ steps.dl_watch.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-watch-extra
          path: ${{ runner.temp }}/in/upstream-watch-extra

      # A directory whose first download failed and whose final result is not a success is removed
      # (also when the retry was skipped), so no partial directory survives for report to read.
      - name: Remove the results that did not download
        if: ${{ !cancelled() }}
        env:
          IN: ${{ runner.temp }}/in
          DL_TRIAL: ${{ steps.dl_trial.outcome }}
          DL_TRIAL_RETRY: ${{ steps.dl_trial_retry.outcome }}
          DL_AVAILABILITY: ${{ steps.dl_availability.outcome }}
          DL_AVAILABILITY_RETRY: ${{ steps.dl_availability_retry.outcome }}
          DL_WATCH: ${{ steps.dl_watch.outcome }}
          DL_WATCH_RETRY: ${{ steps.dl_watch_retry.outcome }}
        run: |
          [[ "${DL_TRIAL}" != failure || "${DL_TRIAL_RETRY}" == success ]] || rm -rf "${IN}/upstream-watch-trial"
          [[ "${DL_AVAILABILITY}" != failure || "${DL_AVAILABILITY_RETRY}" == success ]] || rm -rf "${IN}/upstream-watch-availability"
          [[ "${DL_WATCH}" != failure || "${DL_WATCH_RETRY}" == success ]] || rm -rf "${IN}/upstream-watch-extra"

      # Reports whatever intact directories exist; absent ones are skipped, so a source that failed to
      # download does not hide the others. A failure here turns the job red like the check below.
      - name: Open the issue, close older ones
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ runner.temp }}/in
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FORCE: ${{ inputs.force }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/upstream-check.sh report

      # A job that succeeded must have its result (downloaded, meta.env present). A job that failed
      # reports what it marked, so a failed download there only means no data. Runs after report, so
      # one missing result does not stop the other sources from being reported; it turns the job red.
      - name: Check that the results arrived
        if: ${{ !cancelled() }}
        env:
          IN: ${{ runner.temp }}/in
          TRIAL: ${{ needs.trial.result }}
          AVAILABILITY: ${{ needs.availability.result }}
          WATCH: ${{ needs.watch.result }}
        run: |
          missing=0
          [[ "${TRIAL}" != success || -f "${IN}/upstream-watch-trial/meta.env" ]] || { echo "::error::trial succeeded but its result was not downloaded"; missing=1; }
          [[ "${AVAILABILITY}" != success || -f "${IN}/upstream-watch-availability/meta.env" ]] || { echo "::error::availability succeeded but its result was not downloaded"; missing=1; }
          [[ "${WATCH}" != success || -f "${IN}/upstream-watch-extra/meta.env" ]] || { echo "::error::watch succeeded but its result was not downloaded"; missing=1; }
          exit "${missing}"

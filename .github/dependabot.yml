# Dependabot proposes updates as pull requests; nothing is bumped silently. Here it keeps current
# the GitHub Actions pinned by commit SHA in .github/workflows (the version comment is updated too).
#
# There is deliberately NO docker ecosystem here. The Dockerfile comes from the development
# repository's sync, so a bump of its base images here would be reverted by the next sync. They are
# bumped in the development repository and arrive through the reviewed sync. A distroless digest
# bump is how OS security fixes reach the image; publish runs on request.
#
# There is deliberately NO cargo ecosystem here. Cargo.toml, Cargo.lock and src/relay_server.rs
# come from the development repository's sync, so a Dependabot bump here would be overwritten by,
# or conflict with, the next sync. See docs/ci.md ("Tags and versioning").
# The tool images pinned in ci/lint.sh and ci.yml are bumped by hand (see docs/ci.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

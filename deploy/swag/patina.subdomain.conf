## Version 2026/10/18
# Patina: WebSocket endpoints for RustDesk clients with "Use WebSocket" enabled.
#
# Install: copy to /config/nginx/proxy-confs/patina.subdomain.conf in SWAG, add
# the `patina` subdomain to SWAG's SUBDOMAINS (or the full name to EXTRA_DOMAINS
# if it is not under SWAG's URL, or use a wildcard cert), and make sure the
# swag container is attached to the network that hbbs and hbbr are on
# (rustdesk-net). The container names must resolve as `hbbs` and `hbbr`.
#
# The client builds these URLs itself (hbb_common websocket.rs):
#   wss://patina.<domain>/ws/id     -> hbbs WebSocket port 21118 (rendezvous)
#   wss://patina.<domain>/ws/relay  -> hbbr WebSocket port 21119 (relay)
# Everything else on this vhost is 404, except /api/ which answers `{}` so a
# client with api-server=https://patina.<domain> gets a harmless empty reply.
#
# Keep 21118/21119 unpublished on the host: hbbs only trusts X-Real-IP /
# X-Real-Port from peers inside TRUSTED_PROXY_CIDRS, i.e. this proxy.
#
# This file is included at http{} level (see site-confs/default.conf), so the
# zone definitions below are valid here. The names are prefixed to stay unique.

# Per-client-IP caps in front of hbbs' own limits (MAX_WS_PEERS and the per-IP
# WebSocket cap). Generous on purpose: many devices can share one NAT address,
# and each incoming session opens an extra /ws/id plus a /ws/relay connection.
limit_req_zone  $binary_remote_addr zone=patina_ws_req:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=patina_ws_conn:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name patina.*;

    include /config/nginx/ssl.conf;

    # nginx cannot proxy WebSocket over HTTP/2 (no RFC 8441), so only offer
    # HTTP/1.1 in ALPN for this vhost, whatever the global `http2 on` says.
    http2 off;

    # Nothing here takes a request body except the /api/ stub.
    client_max_body_size 64k;

    location = /ws/id {
        # Plain GETs (scanners, browsers) get nothing.
        if ($http_upgrade !~* ^websocket$) {
            return 404;
        }

        limit_req  zone=patina_ws_req burst=50 nodelay;
        limit_conn patina_ws_conn 128;

        # Resolve at request time so nginx starts even when hbbs is down.
        include /config/nginx/resolver.conf;
        set $upstream_app hbbs;
        set $upstream_port 21118;
        proxy_pass http://$upstream_app:$upstream_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # Overwrite, never append: hbbs must see only the address nginx saw.
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Real-Port     $remote_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Proxy "";

        # The server sends an empty frame every ~12-15s and the client echoes
        # it, so 240s only trips on a dead peer.
        proxy_connect_timeout 10s;
        proxy_read_timeout    240;
        proxy_send_timeout    240;
        proxy_buffering off;
    }

    location = /ws/relay {
        if ($http_upgrade !~* ^websocket$) {
            return 404;
        }

        limit_req  zone=patina_ws_req burst=50 nodelay;
        limit_conn patina_ws_conn 128;

        include /config/nginx/resolver.conf;
        set $upstream_app hbbr;
        set $upstream_port 21119;
        proxy_pass http://$upstream_app:$upstream_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # Overwrite, never append: hbbr must see only the address nginx saw.
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Real-Port     $remote_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Proxy "";

        # A relayed session carries the client's own periodic traffic.
        proxy_connect_timeout 10s;
        proxy_read_timeout    240;
        proxy_send_timeout    240;
        proxy_buffering off;
    }

    # api-server must be https://patina.<domain> for the client to pick wss://,
    # but there is no API server behind it. Answer every call with `{}`.
    location /api/ {
        default_type application/json;
        return 200 '{}';
    }

    location / {
        return 404;
    }
}

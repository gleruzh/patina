# Test-bench TLS proxy. Mirrors the deploy/swag proxy-conf shape:
# /ws/id -> hbbs:21118, /ws/relay -> hbbr:21119, /api/ -> 404, everything else 404.
worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl;
        server_name rd.e2e.test;
        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # hbbs and hbbr share the "edge" network namespace (one IP, like the
        # production host). Reach it over the dedicated proxy network, so hbbs
        # sees nginx as 10.231.4.10 (the trusted proxy subnet).
        location = /ws/id {
            proxy_pass http://10.231.4.11:21118;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Real-Port $remote_port;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 240;
            proxy_send_timeout 240;
        }

        location = /ws/relay {
            proxy_pass http://10.231.4.11:21119;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Real-Port $remote_port;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 240;
            proxy_send_timeout 240;
        }

        location /api/ { return 404; }
        location / { return 404; }
    }
}
